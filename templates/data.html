<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data List</title>
</head>
<body>
    <h1>List of Users</h1>
    <ul>
        {% for user in users %}
            <li>{{ user.nama }} - {{ user.email }} - {{ user.level }}</li>
        {% endfor %}
    </ul>

    <h1>List of Materi</h1>
    <ul>
        {% for materi in materi %}
            <li>{{ materi.judul }} - {{ materi.mata_kuliah }} - {{ materi.kategori }}</li>
        {% endfor %}
    </ul>
</body>
</html>
