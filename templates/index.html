<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Stream Webcam & Video Lokal</title>
    <style>
        /* Tata letak berdampingan */
        .container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        #webcam-video {
            width: 45%;
        }
        #local-video {
            width: 45%;
            height: 250px;
        }
    </style>
</head>
<body>
    <h1>Video Stream Webcam dan Video Lokal</h1>
    <div class="container">
        <!-- Webcam video stream -->
        <div id="webcam-video">
            <h2>Webcam Video</h2>
            <img src="{{ url_for('video_feed') }}" width="30%" height="auto" />
        </div>
        
        <!-- Local Video -->
        <div id="local-video">
            <h2>Video Lokal</h2>
            <video width="100%" height="100%" controls autoplay>
                {% if video %}
                    <source src="{{ url_for('static', filename='uploads/' + video) }}" type="video/mp4">
                {% else %}
                    <p>No video found.</p>
                {% endif %}
                Your browser does not support the video tag.
            </video>
        </div>
    </div>
</body>
</html>
