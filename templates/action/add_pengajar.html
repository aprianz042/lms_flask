<div class="content mt-3">
    <div class="col-lg-12">
        <div id="responseMessage" class="alert alert-dismissible fade show" role="alert" style="display: none;">
            <span id="responseText"></span>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
    
        <div class="card">
            <div class="card-header">
                <strong>Tambah</strong> Penagajar
            </div>
            <div class="card-body card-block">
                <button type="button" class="btn btn-success mb-1" data-toggle="modal" data-target="#add_pengajar">
                    Tambah Pengajar
                </button>

                <table id="bootstrap-data-table-export" class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Nama</th>
                            <th>NIP</th>
                            <th>Kategori</th>
                            <th>Jabatan</th>
                            <th>No.Telp</th>
                            <th>Aksi</th>                                 
                        </tr>
                    </thead>
                    <tbody>
                        {% for pengajar in pengajar %}
                        <tr>
                            <td>{{ loop.index }}</td>  <!-- loop.index0 memberikan indeks mulai dari 0 -->
                            <td>{{ pengajar.nama_pengajar }}</td>
                            <td>{{ pengajar.nip }}</td>
                            <td>{{ pengajar.kategori }}</td>
                            <td>{{ pengajar.jabatan }}</td>
                            <td>{{ pengajar.nomor_hp }}</td>
                            <td>
                                <button type="submit" class="btn btn-primary btn-sm btn-block">
                                    <i class="fa fa-edit"></i> Edit
                                </button>
                            
                                <a href="#" class="btn btn-danger btn-sm btn-block" data-toggle="modal" data-target="#konfirmasiModal{{ pengajar.id }}">
                                    <i class="fa fa-trash-o"></i> Hapus
                                </a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>

                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="add_pengajar" tabindex="-1" role="dialog" aria-labelledby="mediumModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <strong>Tambah Pengajar</strong>
            </div>
            
            <div class="modal-body">
                <div id="responseMessageModal" class="alert alert-dismissible fade show" role="alert" style="display: none;">
                    <span id="responseTextModal"></span>
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                
                <form id="dataForm" class="form-horizontal" enctype="multipart/form-data">

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="nama_pengajar" class=" form-control-label">Nama</label></div>
                        <div class="col-12 col-md-9">
                            <input type="text" id="nama_pengajar" name="nama_pengajar" placeholder="Nama Pengajar..." class="form-control" required>
                        </div>
                    </div>

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="nip" class=" form-control-label">NIP</label></div>
                        <div class="col-12 col-md-9">
                            <input type="text" id="nip" name="nip" placeholder="NIP..." class="form-control" required>
                        </div>
                    </div>

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="email" class=" form-control-label">Email</label></div>
                        <div class="col-12 col-md-9">
                            <input type="email" id="email" name="email" placeholder="Enter Email..." class="form-control" required>
                        </div>
                    </div>

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="alamat" class=" form-control-label">Alamat</label></div>
                        <div class="col-12 col-md-9">
                            <textarea name="alamat" id="alamat" rows="9" placeholder="Alamat ..." class="form-control"></textarea>
                        </div>
                    </div>

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="nomor_hp" class=" form-control-label">No. Hp</label></div>
                        <div class="col-12 col-md-9">
                            <input type="number" id="nomor_hp" name="nomor_hp" placeholder="No Hp..." class="form-control" required>
                        </div>
                    </div>

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="program_studi" class=" form-control-label">Program Studi</label></div>
                        <div class="col-12 col-md-9">
                            <select name="program_studi" id="program_studi" class="form-control" required>
                                <option value="0">Please select</option>
                                <option value="msdm">Manajemen Sumber Daya Manusia</option>
                                <option value="apd">Aparatur Pemerintahan Desa</option>
                            </select>
                        </div>
                    </div>

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="kategori" class=" form-control-label">Kategori</label></div>
                        <div class="col-12 col-md-9">
                            <select name="kategori" id="kategori" class="form-control" required>
                                <option value="0">Please select</option>
                                <option value="dosen">Dosen</option>
                                <option value="pelatih">Pelatih</option>
                            </select>
                        </div>
                    </div>

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="jabatan" class=" form-control-label">Jabatan</label></div>
                        <div class="col-12 col-md-9">
                            <input type="text" id="jabatan" name="jabatan" placeholder="Jabatan..." class="form-control" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="col col-md-3"><label for="tanggal_lahir" class=" form-control-label">Tanggal Lahir</label></div>
                        <div class="col-12 col-md-9">
                            <input type="date" id="tanggal_lahir" name="tanggal_lahir" class="form-control" required>
                        </div>
                    </div>

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="pendidikan_terakhir" class=" form-control-label">Pendidikan Terakhir</label></div>
                        <div class="col-12 col-md-9">
                            <select name="pendidikan_terakhir" id="pendidikan_terakhir" class="form-control" required>
                                <option value="0">Please select</option>
                                <option value="DIII">DIII</option>
                                <option value="DIV">DIV</option>
                                <option value="S1">S1</option>
                                <option value="S2">S2</option>
                                <option value="S3">S3</option>
                            </select>
                        </div>
                    </div>

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="password" class=" form-control-label">Password</label></div>
                        <div class="col-12 col-md-9">
                            <input type="password" id="password" name="password" placeholder="Enter Password..." class="form-control" required>
                        </div>
                    </div>

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="status" class=" form-control-label">Status</label></div>
                        <div class="col-12 col-md-9">
                            <select name="status" id="status" class="form-control" required>
                                <option value="aktif">Aktif</option>
                                <option value="nonaktif">Non-Aktif</option>
                            </select>
                        </div>
                    </div>

                </form>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Cancel</button>
                
                <button type="reset" class="btn btn-danger btn-sm" onclick="resetForm()">
                    <i class="fa fa-ban"></i> Reset
                </button>

                <button type="submit" form="dataForm" class="btn btn-primary btn-sm">
                    <i class="fa fa-dot-circle-o"></i> Submit
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // Fungsi untuk mereset formulir
    function resetForm() {
        const form = document.getElementById('dataForm');
        form.reset(); // Mereset semua input ke nilai defaultnya
        responseMessage.style.display = 'none'; // Menyembunyikan alert
        responseMessageModal.style.display = 'none';
    }

    // Mengambil elemen formulir dan response message
    const form = document.getElementById('dataForm');
    const responseMessage = document.getElementById('responseMessage');
    const responseText = document.getElementById('responseText');
    const responseMessageModal = document.getElementById('responseMessageModal');
    const responseTextModal = document.getElementById('responseTextModal');

    form.addEventListener('submit', function(event) {
        event.preventDefault();  // Mencegah form agar tidak mengarah ke halaman lain

        // Ambil data dari formulir
        const nama_pengajar = document.getElementById('nama_pengajar').value;
        const nip = document.getElementById('nip').value;
        const email = document.getElementById('email').value;
        const alamat = document.getElementById('alamat').value;
        const nomor_hp = document.getElementById('nomor_hp').value;
        const program_studi = document.getElementById('program_studi').value;
        const kategori = document.getElementById('kategori').value;
        const jabatan = document.getElementById('jabatan').value;
        const tanggal_lahir = document.getElementById('tanggal_lahir').value;
        const pendidikan_terakhir = document.getElementById('pendidikan_terakhir').value;
        const password = document.getElementById('password').value;
        const status = document.getElementById('status').value;

        const data = {
            nama_pengajar: nama_pengajar,
            nip: nip,
            email: email,
            alamat: alamat,
            nomor_hp: nomor_hp,
            program_studi: program_studi,
            kategori: kategori,
            jabatan: jabatan,
            tanggal_lahir: tanggal_lahir,
            pendidikan_terakhir: pendidikan_terakhir,
            password: password,
            status: status
        };

        // Reset alert sebelum validasi
        responseMessage.style.display = 'none'; // Menyembunyikan alert jika ada pesan sebelumnya
        responseMessageModal.style.display = 'none';

        // Kirim data menggunakan fetch() ke API Flask
        fetch('http://127.0.0.1:5000/insert_pengajar', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(data => {
            // Tampilkan respons dari Flask
            if (data.message) {
                // Menyimpan pesan sukses di sessionStorage
                sessionStorage.setItem("responseMessage", "success");
                sessionStorage.setItem("responseText", data.message);
                form.reset(); // Reset form setelah berhasil
                window.location.reload();  // Reload halaman untuk memuat ulang data
            } else if (data.error) {
                // Menyimpan pesan error di sessionStorage
                sessionStorage.setItem("responseMessage", "error");
                sessionStorage.setItem("responseText", data.error);
                window.location.reload();  // Reload halaman untuk memuat ulang data
            }
        })
        .catch(error => {
            // Menyimpan pesan error di sessionStorage
            sessionStorage.setItem("responseMessage", "error");
            sessionStorage.setItem("responseText", error.message);
            window.location.reload();  // Reload halaman untuk memuat ulang data
        });
    });

    // Fungsi untuk menampilkan pesan setelah halaman di-reload
    window.onload = function() {
        const responseMessage = document.getElementById('responseMessage');
        const responseText = document.getElementById('responseText');

        const storedMessage = sessionStorage.getItem("responseMessage");
        const storedText = sessionStorage.getItem("responseText");

        if (storedMessage && storedText) {
            if (storedMessage === "success") {
                responseText.textContent = storedText;  // Menampilkan pesan sukses
                responseMessage.classList.remove('alert-danger');
                responseMessage.classList.add('alert-success');
                responseMessage.style.display = 'block';  // Menampilkan alert sukses
            } else if (storedMessage === "error") {
                responseText.textContent = storedText;  // Menampilkan pesan error
                responseMessage.classList.remove('alert-success');
                responseMessage.classList.add('alert-danger');
                responseMessage.style.display = 'block';  // Menampilkan alert error
            }

            // Menghapus data dari sessionStorage setelah ditampilkan
            sessionStorage.removeItem("responseMessage");
            sessionStorage.removeItem("responseText");
        }
    };

</script>
