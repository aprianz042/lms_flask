<div class="content mt-3">
    <div class="col-lg-12">
        <div id="responseMessage" class="alert alert-dismissible fade show" role="alert" style="display: none;">
            <span id="responseText"></span>
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
    
        <div class="card">
            <div class="card-header">
                <strong>Add</strong> Content
            </div>
            <div class="card-body card-block">
                <form id="dataForm" class="form-horizontal" enctype="multipart/form-data">
                    <div class="row form-group">
                        <div class="col col-md-3"><label for="matkul" class=" form-control-label">Mata Kuliah</label></div>
                        <div class="col-12 col-md-9">
                            <input type="text" id="matkul" name="matkul" placeholder="Mata Kuliah ..." class="form-control" required>
                        </div>
                    </div>

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="materi" class=" form-control-label">Judul Materi</label></div>
                        <div class="col-12 col-md-9">
                            <input type="text" id="materi" name="materi" placeholder="Judul Materi ..." class="form-control" required>
                        </div>
                    </div>

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="jenis" class=" form-control-label">Jenis</label></div>
                        <div class="col-12 col-md-9">
                            <select name="jenis" id="jenis" class="form-control" required>
                                <option value="0">Please select</option>
                                <option value="dokumen">Dokumen</option>
                                <option value="video">Video</option>
                            </select>
                        </div>
                    </div>

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="deskripsi" class=" form-control-label">Deskripsi</label></div>
                        <div class="col-12 col-md-9">
                            <textarea name="deskripsi" id="deskripsi" rows="9" placeholder="Deskripsi / Arahan / Perintah ..." class="form-control"></textarea>
                        </div>
                    </div>

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="kategori" class=" form-control-label">Kategori</label></div>
                        <div class="col-12 col-md-9">
                            <select name="kategori" id="kategori" class="form-control" required>
                                <option value="0">Please select</option>
                                <option value="pengajaran">Pengajaran</option>
                                <option value="pelatihan">Pelatihan</option>
                            </select>
                        </div>
                    </div>

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="berkas" class=" form-control-label">Berkas</label></div>
                        <div class="col-12 col-md-9">
                            <input type="file" id="berkas" name="berkas" class="form-control-file">
                        </div>
                    </div>

                    <div class="row form-group">
                        <div class="col col-md-3"><label for="id_pengampu" class=" form-control-label">Dosen / Pelatih</label></div>
                        <div class="col-12 col-md-9">
                            <input type="text" id="id_pengampu" name="id_pengampu" placeholder="Dosen / Pelatih Pengampu ..." class="form-control" required>
                        </div>
                    </div>

                </form>
            </div>

            <div class="card-footer">
                <!-- Tombol Submit di dalam Formulir -->
                <button type="submit" form="dataForm" class="btn btn-primary btn-sm">
                    <i class="fa fa-dot-circle-o"></i> Submit
                </button>
                <button type="reset" class="btn btn-danger btn-sm" onclick="resetForm()">
                    <i class="fa fa-ban"></i> Reset
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // Mengambil elemen formulir dan response message
    const form = document.getElementById('dataForm');
    const responseMessage = document.getElementById('responseMessage');
    const responseText = document.getElementById('responseText');

    form.addEventListener('submit', function(event) {
        event.preventDefault(); // Mencegah form agar tidak mengarah ke halaman lain

        // Ambil data dari formulir
        const mata_kuliah = document.getElementById('matkul').value;
        const judul = document.getElementById('materi').value;
        const jenis = document.getElementById('jenis').value;
        const deskripsi = document.getElementById('deskripsi').value;
        const kategori = document.getElementById('kategori').value;
        const berkas = document.getElementById('berkas').files[0]; // Ambil file yang diupload
        const id_pengampu = document.getElementById('id_pengampu').value;

        // Reset alert sebelum validasi
        responseMessage.style.display = 'none'; // Menyembunyikan alert jika ada pesan sebelumnya

        // Validasi level (tidak boleh 0)
        if (jenis === "0" || kategori == "0") {
            responseText.textContent = "Jenis or Kategori is required and cannot be 'Please select'.";
            responseMessage.classList.remove('alert-success');
            responseMessage.classList.add('alert-danger');
            responseMessage.style.display = 'block';  // Menampilkan alert
            return; // Hentikan proses jika validasi gagal
        }

        // Buat FormData untuk mengirim data termasuk file
        let formData = new FormData();
        formData.append("mata_kuliah", mata_kuliah);
        formData.append("judul", judul);
        formData.append("jenis", jenis);
        formData.append("deskripsi", deskripsi);
        formData.append("kategori", kategori);
        formData.append("berkas", berkas);  // Menambahkan file
        formData.append("id_pengampu", id_pengampu);

        // Kirim data menggunakan fetch() ke API Flask
        fetch('http://127.0.0.1:5000/insert_content', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            // Tampilkan respons dari Flask
            if (data.message) {
                responseText.textContent = data.message;  // Menampilkan pesan sukses
                responseMessage.classList.remove('alert-danger');
                responseMessage.classList.add('alert-success');
                responseMessage.style.display = 'block';  // Menampilkan alert
                form.reset(); // Reset form setelah berhasil
                
            } else if (data.error) {
                responseText.textContent = "Error: " + data.error;  // Menampilkan pesan error
                responseMessage.classList.remove('alert-success');
                responseMessage.classList.add('alert-danger');
                responseMessage.style.display = 'block';  // Menampilkan alert
            }
        })
        .catch(error => {
            responseText.textContent = "Error: " + error.message;  // Menampilkan pesan error jika terjadi kesalahan
            responseMessage.classList.remove('alert-success');
            responseMessage.classList.add('alert-danger');
            responseMessage.style.display = 'block';  // Menampilkan alert
        });
    });

    // Fungsi untuk mereset formulir
    function resetForm() {
        form.reset(); // Mereset semua input ke nilai defaultnya
        responseMessage.style.display = 'none'; // Menyembunyikan alert
    }
</script>
