<div class="content mt-3">
    {% for data in ampuan %}
    <div class="col-lg-3">
        <div class="card border-0 shadow-sm">
            <div class="card-body text-center py-4">
                <div class="mb-3">
                    <i class="fa fa-book fa-3x text-primary"></i>
                </div>
                <h5 class="card-title">{{data.nama_mata_kuliah}}</h5>
                <p class="text-muted small mb-3">Kelas : <b>{{data.nama_kelas}}</b></p>
                <a href="{{ url_for('materi', id=data.id_pengampu) }}" class="btn btn-sm btn-primary">
                    <i class="fa fa-link"></i> Materi
                 </a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
