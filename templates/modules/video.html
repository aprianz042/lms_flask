<div class="content mt-3">

    <div class="col-sm-12">
        <div class="alert  alert-success alert-dismissible fade show" role="alert">
            <span class="badge badge-pill badge-success">Camera Access Required</span> Facial Expression Recognition.
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
    </div>

    <div class="col-lg-9">
        <!--<video width="100%" height="100%" controls autoplay>-->
        <video width="100%" height="100%" controls>
            {% if video %}
                <source src="{{ url_for('static', filename='materi/' + video) }}" type="video/mp4">
            {% else %}
                <p>No video found.</p>
            {% endif %}
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="col-lg-3">
        <img src="{{ url_for('video_feed') }}" width="100%" height="auto" />
    </div>    

</div>
